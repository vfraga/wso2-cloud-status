<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Current status of the WSO2 Cloud products." />
    <!-- The WSO2 pulse glyph; scripts/icons.mjs renders the bitmaps from icon.svg. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>WSO2 Cloud Status</title>
    <!--
      #root holds a short message for a reader without JavaScript or when
      the app does not load. The app replaces it, so it stays hidden for 3
      seconds. Its space is padding, not margin: a margin would collapse into
      the body's, and the whole page would move when the app replaces it.
    -->
    <style>
      body {
        margin: 0;
      }
      .cs-boot {
        max-width: 560px;
        margin: 0 auto;
        padding: 15vh 16px 16px;
        font-family: sans-serif;
        animation: cs-boot-show 0s 3s both;
      }
      @keyframes cs-boot-show {
        from {
          visibility: hidden;
        }
        to {
          visibility: visible;
        }
      }
    </style>
    <noscript>
      <style>
        .cs-boot {
          animation: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root">
      <main class="cs-boot">
        <h1>WSO2 Cloud Status</h1>
        <noscript><p>This page needs JavaScript to show the current status.</p></noscript>
        <p>If the current status does not appear, reload the page in a moment.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
