# Static server for the built site. Runs as an unprivileged user on 8080.
# /api is not served here: route it to the status API at the ingress, same origin
# (api.conf).
# scripts/ops/frontend-image-selftest.sh checks the headers below.

# Hashed filenames never change, so a found asset is cached for a year. Any
# other answer under /assets, above all the 404 for a file this replica does
# not have yet during a deploy, must not be cached: a browser or the CDN would
# keep that 404 for a year after the file exists, and the page would stay
# blank. $status is the status of the response being sent.
map $status $assets_cache_control {
    200     "public, max-age=31536000, immutable";
    206     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-store";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The build compresses each file below at level 9 beside the original.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Emotion injects styles at runtime, hence style-src 'unsafe-inline'. fonts are
    # separate hashed files under /assets.
    set $csp "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # How to report a vulnerability (RFC 9116), written by the image build.
    location = /.well-known/security.txt {
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # A 404 that is never cached, unless a deployment replaces the file.
    include /etc/nginx/api.conf;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $assets_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The entry document must be revalidated so a deploy is seen at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
