# Static server for the built site. Runs as an unprivileged user on 8080.
# /api is not served here: route it to the status API at the ingress, same origin
# (api.conf).
# scripts/ops/frontend-image-selftest.sh checks the headers below.

# Hashed filenames never change, so a found asset is cached for a year. Any
# other answer under /assets, above all the 404 for a file this replica does
# not have yet during a deploy, must not be cached: a browser or the CDN would
# keep that 404 for a year after the file exists, and the page would stay
# blank. $status is the status of the response being sent.
map $status $assets_cache_control {
    200     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-store";
}

# An error nginx writes before it picks a location (400 for an oversized
# header, 414 for an oversized URI) carries no location's headers, and a CDN
# could cache it in place of the file. Every request that reaches a location
# has set $in_server, so only those errors get no-store, and reading it unset
# there logs nothing. A location with no add_header of its own (a replaced
# api.conf) inherits an empty value, which adds no header.
map $in_server $early_cache_control {
    ""      "no-store";
    default "";
}

# $origin_refused and $robots_tag, written from the environment at start by
# docker-entrypoint.d/40-origin-lock.sh (docker/origin-lock.sh). nginx does
# not start without it.
include /tmp/origin.conf;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Slow clients are cut off as statusd cuts them (5 s for the request head,
    # 10 s to send an answer), so a few cannot hold every connection.
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;

    # No byte ranges: every file is small, and a range past a file's end
    # would answer 416 with the file's year-long Cache-Control.
    max_ranges 0;

    # Front Door's access log records every request, so nginx keeps its error
    # log only: a flood of refused requests writes nothing here.
    access_log off;

    set $in_server 1;
    uninitialized_variable_warn off;
    add_header Cache-Control $early_cache_control always;

    root /usr/share/nginx/html;
    index index.html;

    # The build compresses each file below at level 9 beside the original.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Emotion injects styles at runtime, hence style-src 'unsafe-inline'. fonts are
    # separate hashed files under /assets.
    set $csp "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests";

    # Error answers come from a page of our own, which names no server
    # software as nginx's own pages do; each keeps its status. It is never
    # cached, carries the security headers, and cannot be fetched directly.
    error_page 400 401 403 404 405 408 411 412 413 414 416 431 494 500 501 502 503 504 505 /error.html;
    location = /error.html {
        internal;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /healthz {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # How to report a vulnerability (RFC 9116), written by the image build.
    location = /.well-known/security.txt {
        include /etc/nginx/snippets/origin-lock.conf;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # A 404 that is never cached, unless a deployment replaces the file.
    include /etc/nginx/api.conf;

    location /assets/ {
        include /etc/nginx/snippets/origin-lock.conf;
        try_files $uri =404;
        add_header Cache-Control $assets_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The page's own routes (src/lib/router.tsx) get the HTML shell, which is
    # revalidated on every load so a deploy is seen at once. No CDN copy: one
    # could name scripts a new release no longer has, as the image holds only
    # its own release's.
    location ~ "^/(index\.html|history|products/[a-z0-9-]+)?/*$" {
        include /etc/nginx/snippets/origin-lock.conf;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The icons at the root change only with a release; any other path is a
    # 404 from the error page.
    location / {
        include /etc/nginx/snippets/origin-lock.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
