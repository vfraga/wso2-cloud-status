# /api belongs to the status API, which the ingress (Front Door) routes on the
# same origin. This image never answers it with the HTML shell, and never lets
# that 404 be cached: once the ingress routes /api correctly, it must work at
# once. A deployment with nothing in front of the page to route /api (the
# Choreo demo) replaces this file with one that forwards /api/ to statusd.
location /api/ {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
    return 404;
}
