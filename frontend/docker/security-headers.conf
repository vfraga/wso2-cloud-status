add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS: browsers ignore it over plain HTTP, so local runs are unaffected.
# Front Door terminates TLS and passes it on. No includeSubDomains or
# preload: those bind every host under the name and are for the domain's
# owners to decide.
add_header Strict-Transport-Security "max-age=31536000" always;
