add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# WSO2's deployment security checklist's recommended list: the page uses none
# of these features. document-domain and web-share are left out: Chromium
# reports them as unrecognised and logs a warning on every page.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(self), usb=(), xr-spatial-tracking=()" always;
# HSTS: browsers ignore it over plain HTTP, so local runs are unaffected.
# Front Door terminates TLS and passes it on. includeSubDomains covers only
# this host's own subdomains (RFC 6797 section 6.1.2). preload is left out:
# the preload list takes only a registrable domain, which belongs to its
# owners.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# noindex outside production (INDEXING=off); no header at all when empty.
add_header X-Robots-Tag $robots_tag always;
