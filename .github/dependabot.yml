# Version updates wait 7 days after a release (cooldown), so a compromised
# release is more likely to be caught and pulled before it reaches a pull
# request. Security updates are not delayed: Dependabot opens them as soon as
# an advisory affects us. Base images have no advisories of their own, so the
# two runtime images skip the cooldown and are checked daily: their rebuilds
# carry the operating system's security fixes. Every pull request is reviewed.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/backend/go", "/tests/contract"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/frontend"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: ["/backend/go", "/frontend"]
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: ["distroless/static-debian13", "nginxinc/nginx-unprivileged"]
