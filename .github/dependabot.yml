# Version updates wait 7 days after a release (cooldown), so a compromised
# release is more likely to be caught and pulled before it reaches a pull
# request. Security updates are not delayed: Dependabot opens them as soon as
# an advisory affects us. See docs/dependency-policy.md.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/backend/go", "/tests/contract"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/frontend"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: ["/backend/go", "/frontend"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
