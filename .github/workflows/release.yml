# Release: a tag v<major>.<minor>.<patch> on a commit of main runs CI on that
# commit, then builds both images and pushes them by digest, scans them,
# signs them keyless with Sigstore cosign (this workflow's OIDC identity),
# attests their build provenance and their CycloneDX SBOMs, and only then
# gives them the version tag. A run that fails leaves no version behind and
# can be run again. A GitHub release follows with the CHANGELOG.md section,
# both SBOMs and the image digests. Deploy by digest, after checking the
# signature (cosign verify) and the attestations (gh attestation verify).
#
# Off until the repository variable REGISTRY is set: until then every tag
# push skips every job. Settings:
#   vars.REGISTRY              registry host and path prefix, for example
#                              <name>.azurecr.io/wso2-cloud-status; the images
#                              are $REGISTRY/wso2-cloud-statusd and
#                              $REGISTRY/wso2-cloud-status-web
#   secrets.REGISTRY_USERNAME  credentials with push rights (for Azure
#   secrets.REGISTRY_PASSWORD  Container Registry, a repository-scoped token)
# This workflow runs from the tagged commit, so its own checks are only as
# trustworthy as whoever may push a v* tag. Before setting REGISTRY: a tag
# ruleset limits who may create v* tags, and the environment "release",
# limited to v* tags with required reviewers, holds both secrets (open
# question 29). Artifact attestations need a public repository, or GitHub
# Enterprise Cloud for a private one. Every third-party action is pinned to a
# full commit SHA, as in ci.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The cosign release that sigstore/cosign-installer installs and verifies.
  COSIGN_RELEASE: v3.1.3
  # The Trivy release every trivy-action step installs, as in ci.yml.
  TRIVY_VERSION: v0.76.1
  # The BuildKit that builds the images, as in ci.yml.
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

jobs:
  ci:
    name: CI on the tagged commit
    if: vars.REGISTRY != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  images:
    name: Build, scan, sign, attest and tag the images
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # keyless signing and attestations: a Sigstore certificate for this workflow's OIDC identity
      attestations: write # store the provenance and SBOM attestations
    outputs:
      statusd-digest: ${{ steps.statusd.outputs.digest }}
      web-digest: ${{ steps.web.outputs.digest }}
    env:
      REGISTRY: ${{ vars.REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main, to check that the tag is on it
          persist-credentials: false
      - name: The tag is a release of a commit on main, with a CHANGELOG.md section
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Release::$TAG is not v<major>.<minor>.<patch>; pre-releases are not published"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Release::$TAG is not on main; tag a commit of main"
            exit 1
          fi
          if ! grep -q "^## \[${TAG#v}\]" CHANGELOG.md; then
            echo "::error title=Release::CHANGELOG.md has no section \"## [${TAG#v}]\""
            exit 1
          fi
          {
            echo "version=$TAG"
            echo "created=$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
            echo "source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "host=${REGISTRY%%/*}"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.meta.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      # A released version is never tagged twice: deployments name it. Only
      # an answer that the tag does not exist lets the release go on; any
      # other error (authentication, network, the registry) stops it.
      - name: The version is not in the registry yet
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for image in wso2-cloud-statusd wso2-cloud-status-web; do
            if answer=$(docker buildx imagetools inspect "$REGISTRY/$image:$VERSION" 2>&1); then
              echo "::error title=Release::$REGISTRY/$image:$VERSION already exists; release a new version instead"
              exit 1
            fi
            case $answer in
              *"not found"* | *MANIFEST_UNKNOWN* | *NAME_UNKNOWN*) ;;
              *)
                echo "::error title=Release::cannot tell whether $REGISTRY/$image:$VERSION exists: $answer"
                exit 1
                ;;
            esac
          done
      # Pushed by digest, without the version tag, which comes last. provenance
      # and sbom off: the image is a single manifest, and the signed
      # attestations below carry provenance and the SBOM.
      - name: Build and push statusd by digest
        id: statusd
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/go/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            SOURCE=${{ steps.meta.outputs.source }}
          outputs: type=image,name=${{ vars.REGISTRY }}/wso2-cloud-statusd,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
      - name: Build and push the frontend by digest
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            SOURCE=${{ steps.meta.outputs.source }}
          outputs: type=image,name=${{ vars.REGISTRY }}/wso2-cloud-status-web,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
      - name: Vulnerabilities of statusd (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ vars.REGISTRY }}/wso2-cloud-statusd@${{ steps.statusd.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Vulnerabilities of the frontend (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ vars.REGISTRY }}/wso2-cloud-status-web@${{ steps.web.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}
      - name: Sign both images by digest (keyless)
        env:
          STATUSD_DIGEST: ${{ steps.statusd.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          cosign sign --yes "$REGISTRY/wso2-cloud-statusd@$STATUSD_DIGEST"
          cosign sign --yes "$REGISTRY/wso2-cloud-status-web@$WEB_DIGEST"
      - name: SBOM of statusd (CycloneDX, Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ vars.REGISTRY }}/wso2-cloud-statusd@${{ steps.statusd.outputs.digest }}
          format: cyclonedx
          output: statusd.cdx.json
      - name: SBOM of the frontend (CycloneDX, Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ vars.REGISTRY }}/wso2-cloud-status-web@${{ steps.web.outputs.digest }}
          format: cyclonedx
          output: web.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: |
            statusd.cdx.json
            web.cdx.json
          if-no-files-found: error
      - name: Build provenance of statusd
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ vars.REGISTRY }}/wso2-cloud-statusd
          subject-digest: ${{ steps.statusd.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Build provenance of the frontend
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ vars.REGISTRY }}/wso2-cloud-status-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: SBOM attestation of statusd
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ vars.REGISTRY }}/wso2-cloud-statusd
          subject-digest: ${{ steps.statusd.outputs.digest }}
          sbom-path: statusd.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: SBOM attestation of the frontend
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ vars.REGISTRY }}/wso2-cloud-status-web
          subject-digest: ${{ steps.web.outputs.digest }}
          sbom-path: web.cdx.json
          push-to-registry: true
          create-storage-record: false
      # Last: only a built, scanned, signed and attested image gets the
      # version. --prefer-index=false keeps the tag on the signed manifest.
      - name: Tag both images with the version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          STATUSD_DIGEST: ${{ steps.statusd.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            -t "$REGISTRY/wso2-cloud-statusd:$VERSION" "$REGISTRY/wso2-cloud-statusd@$STATUSD_DIGEST"
          docker buildx imagetools create --prefer-index=false \
            -t "$REGISTRY/wso2-cloud-status-web:$VERSION" "$REGISTRY/wso2-cloud-status-web@$WEB_DIGEST"

  release:
    name: GitHub release with the SBOMs and digests
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release and upload the SBOMs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: sbom
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          REGISTRY: ${{ vars.REGISTRY }}
          STATUSD_DIGEST: ${{ needs.images.outputs.statusd-digest }}
          WEB_DIGEST: ${{ needs.images.outputs.web-digest }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md
            printf '\n### Images\n\n'
            # \140 is a backquote: each reference is set as code.
            printf -- '- \140%s/wso2-cloud-statusd@%s\140\n' "$REGISTRY" "$STATUSD_DIGEST"
            printf -- '- \140%s/wso2-cloud-status-web@%s\140\n' "$REGISTRY" "$WEB_DIGEST"
            printf '\nBoth are scanned, signed keyless by this workflow, with build provenance and the attached CycloneDX SBOMs attested; check both (cosign verify, gh attestation verify) before deploying, and deploy by digest.\n'
          } >"$notes"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes" sbom/statusd.cdx.json sbom/web.cdx.json
