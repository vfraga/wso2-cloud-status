# Release: a tag v<major>.<minor>.<patch> on a commit of main runs CI on that
# commit, then two jobs. The build job holds no registry credentials and no
# OIDC token: it builds both images into OCI layouts, records their digests,
# scans them and writes their CycloneDX SBOMs (Trivy), and hands the layouts
# and SBOMs on as artifacts. The publish job holds the credentials and the
# token and runs only GitHub's actions and sigstore/cosign-installer: it
# checks that each layout is the one the build job recorded, pushes it by
# that digest (skopeo, digests preserved), signs both images keyless with
# Sigstore cosign (this workflow's OIDC identity), attests their build
# provenance and their SBOMs, and only then gives them the version tag. A run
# that fails before that step leaves no version behind and can be run again;
# one that fails between the two tags leaves statusd's, which a release
# manager deletes before running it again (the workflow refuses a version
# the registry already has). A GitHub release
# follows with the CHANGELOG.md section, both SBOMs and the image digests.
# Deploy by digest, after checking the signature (cosign verify) and the
# attestations (gh attestation verify).
#
# Off until the repository variable REGISTRY is set: until then every tag
# push skips every job. Settings:
#   vars.REGISTRY              registry host and path prefix, for example
#                              <name>.azurecr.io/wso2-cloud-status; the images
#                              are $REGISTRY/wso2-cloud-statusd and
#                              $REGISTRY/wso2-cloud-status-web
#   secrets.REGISTRY_USERNAME  credentials with push rights (for Azure
#   secrets.REGISTRY_PASSWORD  Container Registry, a repository-scoped token)
# This workflow runs from the tagged commit, so its own checks are only as
# trustworthy as whoever may push a v* tag. Before setting REGISTRY: a tag
# ruleset limits who may create v* tags, and the environment "release",
# limited to v* tags with required reviewers, holds both secrets. Artifact
# attestations need a public repository, or GitHub Enterprise Cloud for a
# private one. Every third-party action is pinned to a full commit SHA, as in
# ci.yml. No job here restores an Actions cache: any job on main can write
# one, and a tool binary or database restored from it would run with the
# publish job's credentials or shape the images it signs. So every
# trivy-action step sets cache "false", and make pins fails when a job with
# secrets or id-token: write uses an action with its cache on.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The cosign release that sigstore/cosign-installer installs and verifies.
  COSIGN_RELEASE: v3.1.3
  # The Trivy release every trivy-action step installs, as in ci.yml.
  TRIVY_VERSION: v0.76.1
  # The BuildKit that builds the images, as in ci.yml.
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

jobs:
  ci:
    name: CI on the tagged commit
    if: vars.REGISTRY != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and scan the images, without credentials
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      # Recorded by the build steps themselves, before any scan runs.
      statusd-digest: ${{ steps.statusd.outputs.digest }}
      web-digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main, to check that the tag is on it
          persist-credentials: false
      - name: The tag is a release of a commit on main, with a CHANGELOG.md section and nothing left under Unreleased
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Release::$TAG is not v<major>.<minor>.<patch>; pre-releases are not published"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Release::$TAG is not on main; tag a commit of main"
            exit 1
          fi
          # The section names the version, dots matched as dots, and the
          # release date: "## [0.5.0] - 2026-11-02".
          version="${TAG#v}"
          if ! grep -qE "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error title=Release::CHANGELOG.md has no section \"## [$version] - <date>\""
            exit 1
          fi
          if awk '/^## \[Unreleased\]/ { on = 1; next } on && /^## \[/ { exit } on && NF { found = 1; exit } END { exit !found }' CHANGELOG.md; then
            echo "::error title=Release::CHANGELOG.md's \"## [Unreleased]\" section is not empty; fold it into \"## [${TAG#v}]\" first"
            exit 1
          fi
          {
            echo "version=$TAG"
            echo "created=$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
            echo "source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      # Each image goes to an OCI layout directory named after it, which
      # Trivy scans, its SBOMs name and the publish job pushes as it is.
      # provenance and sbom off: the image is a single manifest, and the
      # signed attestations carry provenance and the SBOM.
      - name: Build statusd
        id: statusd
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/go/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            SOURCE=${{ steps.meta.outputs.source }}
          outputs: type=oci,dest=wso2-cloud-statusd,tar=false
          provenance: false
          sbom: false
      - name: Build the frontend
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            SOURCE=${{ steps.meta.outputs.source }}
          outputs: type=oci,dest=wso2-cloud-status-web,tar=false
          provenance: false
          sbom: false
      - name: Vulnerabilities of statusd (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: "false"
          input: wso2-cloud-statusd
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: Vulnerabilities of the frontend (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: "false"
          input: wso2-cloud-status-web
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
      - name: SBOM of statusd (CycloneDX, Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: "false"
          input: wso2-cloud-statusd
          format: cyclonedx
          output: statusd.cdx.json
      - name: SBOM of the frontend (CycloneDX, Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: "false"
          input: wso2-cloud-status-web
          format: cyclonedx
          output: web.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: |
            wso2-cloud-statusd
            wso2-cloud-status-web
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: |
            statusd.cdx.json
            web.cdx.json
          if-no-files-found: error

  publish:
    name: Push, sign, attest and tag the images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # keyless signing and attestations: a Sigstore certificate for this workflow's OIDC identity
      attestations: write # store the provenance and SBOM attestations
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      VERSION: ${{ needs.build.outputs.version }}
      STATUSD_DIGEST: ${{ needs.build.outputs.statusd-digest }}
      WEB_DIGEST: ${{ needs.build.outputs.web-digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
      # The artifact passed through the job that ran Trivy. Each layout must
      # hold exactly the manifest the build step recorded before any scan
      # ran; the push below sends it under that digest or not at all.
      - name: The layouts are the images the build job recorded and scanned
        run: |
          for pair in "wso2-cloud-statusd $STATUSD_DIGEST" "wso2-cloud-status-web $WEB_DIGEST"; do
            read -r image want <<<"$pair"
            have="$(jq -r 'if (.manifests | length) == 1 then .manifests[0].digest else "not one manifest" end' "$image/index.json")"
            if [[ ! "$want" =~ ^sha256:[0-9a-f]{64}$ || "$have" != "$want" ]]; then
              echo "::error title=Release::$image holds $have, the build job recorded ${want:-no digest}"
              exit 1
            fi
          done
      - name: Log in to the registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login "${REGISTRY%%/*}" --username "$REGISTRY_USERNAME" --password-stdin
      # A released version is never tagged twice: deployments name it. Only
      # an answer that the tag does not exist lets the release go on; any
      # other error (authentication, network, the registry) stops it.
      - name: The version is not in the registry yet
        run: |
          for image in wso2-cloud-statusd wso2-cloud-status-web; do
            if answer=$(docker buildx imagetools inspect "$REGISTRY/$image:$VERSION" 2>&1); then
              echo "::error title=Release::$REGISTRY/$image:$VERSION already exists; release a new version instead"
              exit 1
            fi
            case $answer in
              *"not found"* | *MANIFEST_UNKNOWN* | *NAME_UNKNOWN*) ;;
              *)
                echo "::error title=Release::cannot tell whether $REGISTRY/$image:$VERSION exists: $answer"
                exit 1
                ;;
            esac
          done
      # Pushed by digest, without the version tag, which comes last. skopeo
      # (on the runner image) reads the registry login above, and with
      # --preserve-digests refuses a push whose manifest digest would differ
      # from the reference's.
      - name: Push both images by digest
        run: |
          skopeo copy --preserve-digests oci:wso2-cloud-statusd "docker://$REGISTRY/wso2-cloud-statusd@$STATUSD_DIGEST"
          skopeo copy --preserve-digests oci:wso2-cloud-status-web "docker://$REGISTRY/wso2-cloud-status-web@$WEB_DIGEST"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}
      - name: Sign both images by digest (keyless)
        run: |
          cosign sign --yes "$REGISTRY/wso2-cloud-statusd@$STATUSD_DIGEST"
          cosign sign --yes "$REGISTRY/wso2-cloud-status-web@$WEB_DIGEST"
      - name: Build provenance of statusd
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ vars.REGISTRY }}/wso2-cloud-statusd
          subject-digest: ${{ needs.build.outputs.statusd-digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Build provenance of the frontend
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ vars.REGISTRY }}/wso2-cloud-status-web
          subject-digest: ${{ needs.build.outputs.web-digest }}
          push-to-registry: true
          create-storage-record: false
      - name: SBOM attestation of statusd
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ vars.REGISTRY }}/wso2-cloud-statusd
          subject-digest: ${{ needs.build.outputs.statusd-digest }}
          sbom-path: statusd.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: SBOM attestation of the frontend
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ vars.REGISTRY }}/wso2-cloud-status-web
          subject-digest: ${{ needs.build.outputs.web-digest }}
          sbom-path: web.cdx.json
          push-to-registry: true
          create-storage-record: false
      # Last: only a built, scanned, signed and attested image gets the
      # version. --prefer-index=false keeps the tag on the signed manifest.
      - name: Tag both images with the version
        run: |
          docker buildx imagetools create --prefer-index=false \
            -t "$REGISTRY/wso2-cloud-statusd:$VERSION" "$REGISTRY/wso2-cloud-statusd@$STATUSD_DIGEST"
          docker buildx imagetools create --prefer-index=false \
            -t "$REGISTRY/wso2-cloud-status-web:$VERSION" "$REGISTRY/wso2-cloud-status-web@$WEB_DIGEST"

  release:
    name: GitHub release with the SBOMs and digests
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release and upload the SBOMs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: sbom
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          REGISTRY: ${{ vars.REGISTRY }}
          STATUSD_DIGEST: ${{ needs.build.outputs.statusd-digest }}
          WEB_DIGEST: ${{ needs.build.outputs.web-digest }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            awk -v head="## [${TAG#v}]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md
            printf '\n### Images\n\n'
            # \140 is a backquote: each reference is set as code.
            printf -- '- \140%s/wso2-cloud-statusd@%s\140\n' "$REGISTRY" "$STATUSD_DIGEST"
            printf -- '- \140%s/wso2-cloud-status-web@%s\140\n' "$REGISTRY" "$WEB_DIGEST"
            printf '\nBoth are scanned, signed keyless by this workflow, with build provenance and the attached CycloneDX SBOMs attested; check both (cosign verify, gh attestation verify) before deploying, and deploy by digest.\n'
          } >"$notes"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes" sbom/statusd.cdx.json sbom/web.cdx.json
