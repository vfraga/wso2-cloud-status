# CodeQL in CI is licensed for open-source code on a public repository, or
# with GitHub Code Security (GitHub Advanced Security) on a private one. On a
# private repository without it, set the repository variable
# ADVANCED_SECURITY to "off" and this job is skipped; nothing else in CI
# does its data-flow analysis.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: vars.ADVANCED_SECURITY != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # workflow run details for the analysis
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go/go.mod
          cache-dependency-path: backend/go/go.sum
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      # Both Go modules: the service, and the contract tests with the fixture
      # upstream they run.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          (cd backend/go && go build ./...)
          (cd tests/contract && go build ./...)
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
