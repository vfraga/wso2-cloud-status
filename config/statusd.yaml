# statusd configuration for local runs and tests. Production runs
# config/statusd.production.yaml, which differs only in the origin lock (a
# test fails otherwise): change both. A new product also goes in
# frontend/src/lib/fallbackProducts.ts and testdata/upstream; tests fail
# until they agree. Check a file with:
# statusd -check-config <file>
#
# Products appear on the page in the order listed. Region keys are the
# upstream's keys; ids are our slugs and part of the public API
# (api/openapi.yaml, "Identifiers"). "description" is the optional subtitle.
# A region that is a part of a place (a control plane, a data plane) names
# the place in "location" and starts its name with it; the page lists those
# regions under the place, control plane first. Every region of a product
# has a location, or none does.
#
# ${NAME} reads the environment variable NAME; an unset one fails
# validation. Unquoted, the result reads as if written there, so it can set
# a number (max_in_flight: ${MAX_IN_FLIGHT}); quoted, it stays text. Keep
# secrets out of this file.

server:
  addr: ":8080"
  # Metrics and probes; never route this port through the public ingress.
  admin_addr: ":9090"
  # max-age plus stale-while-revalidate must stay under the page's 30 s poll,
  # and stale-if-error at most polling.stale_after; -check-config enforces both.
  cache_control: "public, max-age=10, stale-while-revalidate=10, stale-if-error=300"
  allowed_origins: ["*"]
  shutdown_timeout: 10s
  # Requests beyond this concurrency get 503 + Retry-After instead of queueing.
  max_in_flight: 1024
  # The origin lock stays off here for local runs and tests;
  # config/statusd.production.yaml turns it on with these lines.
  # required_headers:
  #   X-Azure-FDID: "${FRONT_DOOR_ID}"

# Settings above (server) and below (reload) need a restart; everything else
# reloads live.
reload:
  watch_interval: 10s

polling:
  components_interval: 30s
  uptime_interval: 5m
  incidents_interval: 30s
  request_timeout: 5s
  stale_after: 5m

history:
  days: 90

backends:
  cloudservices:
    type: legacy-status-api
    base_url: https://api.status.cloudservices.wso2.com
    # The API sends zone-less timestamps in UTC: CSM converts its stored
    # times to UTC (read in its public source, cs-tools, 2026-10-21) and the
    # existing pages print them as UTC.
    timezone: UTC
  asgardeo:
    type: legacy-status-api
    base_url: https://api.status.asgardeo.io
    # Taken to be UTC like the other; no source states it. Each backend's
    # zone is checked against a known incident on staging before go-live.
    timezone: UTC
  # CSM's cloud-status API (csm-integration-service behind Choreo's API
  # gateway) serves every cloud once a client exists for it; point a
  # product's sources at it by changing their backend to csm:
  # csm:
  #   type: csm-cloud-status
  #   base_url: https://<gateway>/<csm-integration-service context>
  #   timezone: UTC
  #   options:
  #     token_url: https://<token endpoint>
  #     client_id: "${CSM_CLIENT_ID}"
  #     client_secret: "${CSM_CLIENT_SECRET}"

products:
  - id: agent-platform
    name: Agent Platform
    description: Agent Manager
    # AI Gateway and Agent ID have no status source yet.
    sources:
      - backend: cloudservices
        cloud: agent-manager
        regions:
          - { key: "cp - us", id: us-control-plane, name: US control plane, location: US }
          - { key: "dp - us", id: us-data-plane, name: US data plane, location: US }

  - id: api-platform
    name: API Platform
    description: Bijira
    sources:
      - backend: cloudservices
        cloud: bijira
        regions:
          - { key: "cp - us", id: us-control-plane, name: US control plane, location: US }
          - { key: "dp - us", id: us-data-plane, name: US data plane, location: US }
          - { key: "cp - eu", id: eu-control-plane, name: EU control plane, location: EU }
          - { key: "dp - eu", id: eu-data-plane, name: EU data plane, location: EU }

  - id: integration-platform
    name: Integration Platform
    description: Devant
    sources:
      - backend: cloudservices
        cloud: devant
        regions:
          - { key: "cp - us", id: us-control-plane, name: US control plane, location: US }
          - { key: "dp - us", id: us-data-plane, name: US data plane, location: US }
          - { key: "cp - eu", id: eu-control-plane, name: EU control plane, location: EU }
          - { key: "dp - eu", id: eu-data-plane, name: EU data plane, location: EU }

  - id: identity-platform
    name: Identity Platform
    description: Asgardeo
    sources:
      - backend: asgardeo
        cloud: asgardeo
        regions:
          - { key: us, id: us, name: US }
          - { key: eu, id: eu, name: EU }

  - id: developer-platform
    name: Developer Platform
    description: Choreo
    sources:
      - backend: cloudservices
        cloud: choreo
        regions:
          - { key: cp, id: us-control-plane, name: US control plane, location: US }
          - { key: "us - dp", id: us-data-plane, name: US data plane, location: US }
          - { key: "eu - dp", id: eu-data-plane-us-managed, name: EU data plane (US-managed), location: EU }
      - backend: cloudservices
        cloud: choreo-eu
        regions:
          - { key: "eu - cp", id: eu-control-plane, name: EU control plane, location: EU }
          - { key: "eu - dp - eu", id: eu-data-plane, name: EU data plane, location: EU }

  - id: moesif
    name: Moesif
    sources:
      - backend: cloudservices
        cloud: moesif
        regions:
          - { key: us, id: us, name: US }
